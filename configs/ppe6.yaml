# Thử nghiệm 6 lớp, nhánh exp/ppe6 (docs/experiments/2026-11-06_ppe6_plan.md).
# Lớp 0-3 giữ nguyên ppe4 để so được với r2, r3. Dùng bởi scripts/03c_ppe6_review_sheets.py.
classes: {0: person, 1: helmet, 2: vest, 3: gloves, 4: goggles, 5: boots}

review:
  seed: 0
  # Mã lớp gốc của hộp cần duyệt. Tên lớp xem data/raw/<bộ>/README.md và data/raw/construction_ppe/data.yaml.
  sources:
    sh17: {goggles: 8, boots: 14}               # glasses, shoes: lẫn đồ thường, phải duyệt
    construction_ppe: {goggles: 4, boots: 3}    # goggles, boots
  # Hộp có cạnh dài dưới min_side_px ở đầu vào imgsz không được duyệt bằng mắt. Giá trị đặt theo cảm quan, chưa đo.
  min_side_px: 24
  min_side_grid: [16, 20, 24, 28, 32, 40]
  dark_luma: 70        # trung vị độ sáng 0-255 của hộp dưới mức này coi là giày tối, chỉ để phân tầng mẫu
  p2_shoes: 100
  imgsz: 960
  # Bảng ảnh duyệt: chỉ để người và máy xem, không ảnh hưởng nhãn.
  sheet: {cols: 10, rows: 8, tile_px: 128, context: 0.75}   # context: nới mỗi phía, tính theo cạnh dài của hộp

# Định nghĩa kính phiên bản 2 (06/11/2026): Claude xem lại 407 hộp `safety` ngoài cảnh mũ cam. Dùng bởi 03d_ppe6_decisions_v2.py.
goggles_v2:
  dark_lens: >-
    b00048 b00071 b00668 b00708 b00709 b00710 b00888 b00889 b01335 b01348 b01401 b01402 b01403 b01404 b01407 b01465
    b01524 b01556 b01582 b01718 b01845 b02210 b02607 b02766 b02767 b02769 b02772 b03032 b03185 b03201 b03215 b03226
    b03228 b05032 b05035 b05089 b05249 b05318 b06362 b07305 b07995 b07996 b08004 b08006 b08009 b08010 b08495
  plain_frame: b00679 b00680 b00702 b00707 b00811 b00835 b00848 b00855 b00879 b00898
  not_worn: b05483

# Gom cảnh: đặc trưng từ 03e_ppe6_scene_features.py, ngưỡng do 03f chọn và báo cáo.
scene:
  weights: yolo11s.pt
  imgsz: 320
  side: 640
  batch: 32
  sweep: {emb_strong: [0.95, 0.96, 0.97, 0.98, 0.99]}
  near_margin: 0.02
  near_samples: 60
  # Chọn 06/11/2026 bằng 03f --sweep: 8475 cụm, cụm lớn nhất 397 ảnh (355/380 ảnh thẻ mũ cam, 385/411 ảnh thẻ ủng đỏ).
  # Ngưỡng lỏng hơn nối thành cụm hàng nghìn ảnh; chặt hơn (emb 0.95) xé cảnh đã biết thành hơn 100 cụm.
  # emb_strong: nới thêm cho cặp rất giống nhưng khác màu; chọn 06/11/2026 bằng --sweep: 0.97 cho 8322 cụm, lớn nhất 573; 0.96 lên 951.
  emb_strong: 0.97
  phash_max: 8
  emb_min: 0.93
  hist_min: 0.85

# Chọn cảnh cho val_new, test_new (03h_ppe6_select_eval.py). Mục tiêu do nhóm đặt 06/11/2026.
eval:
  seed: 0
  target_boots: 100
  cp_share: 0.3            # tỉ lệ tối thiểu hộp ủng Construction-PPE ở mỗi tập
  max_scene_boots: 30      # cảnh có nhiều hộp ủng hơn mức này thì không dùng, để hộp trải trên nhiều cảnh
  levels: [[80, 0.3], [100, 0.3], [120, 0.3]]


train_scene_cap: 30        # mỗi cảnh lặp ở train giữ tối đa chừng này ảnh (nhóm chốt 06/11/2026)
# Cụm thật sự là một cảnh lặp, Claude xem 10 ảnh mẫu của 8 cụm lớn nhất, chờ người xác nhận. s00000, s00002, s00003, s00004, s00006
# là cụm nối nhầm các ảnh không liên quan nên không giới hạn. Không dùng số đo: median cosine không tách được (s00001 0.869, s00003 0.913).
repeat_scenes: [s00001, s00005, s00007]

# Kiểm tra sơ bộ CHVG của Claude (06/11/2026), chưa phải người duyệt. Số là idx trong external/chvg/glass_order.csv.
# unclear: mờ, tối, không rõ là kính bảo hộ, hoặc gọng giống kính cận.
chvg_precheck:
  unclear: >-
    13 25 26 27 28 33 38 39 70 71 72 74 79 80 108 124 133 138 152 190 202 230 231 233 284 285 289 291 297 310 420
  missing_label_images: "50 88 94"   # thứ tự trong noglass_order.txt: ảnh không có hộp glass nhưng thấy người đeo kính

# Gói duyệt CVAT (03k). Thời gian là giả định để ước tính, chưa đo.
pack:
  side: 1920
  p2_chvg: 60
  sec_per_box: 6
  sec_per_image: 8
  sec_per_scene: 20
  sec_per_chv_image: 15
  trial_boxes: 10
  chv_boots_images: 100

# Ngưỡng "người đủ lớn" (03l --report): chiều cao người tối thiểu mà từ đó trở lên tỉ lệ người duyệt nhìn rõ đạt min_ok_rate.
# Chưa chọn: phải có kết quả duyệt, chốt trước khi train.
scope:
  side: 1920
  min_ok_rate: 0.9
  min_boxes: 30          # cần ít nhất chừng này hộp có ý kiến mỗi lớp mới đề xuất ngưỡng; Claude đặt, chưa đo
  min_person_px: {boots: null, goggles: null}

# Ghép kính CHVG vào ảnh CHV train (03m). Ngưỡng xác nhận cùng ảnh, cùng hệ tọa độ, đo ngày 06/11/2026 trên 1.283 ảnh trùng tên.
chv_merge:
  min_corr: 0.98
  max_hamming: 8
  min_helmet_iou: 0.5
  # Claude xem 130 hộp kính ở ảnh CHV train: tối, mờ, gọng giống kính cận thì để không rõ. Số là idx trong glass_order.csv. Chưa người duyệt.
  unclear: >-
    364 368 376 398 412 413 414 415 426 427 432 436 437 439 449 451 452 453 454 455 458 476 477 478 481 482 483 484 485 492 493 494 508 509 520 528

# Che vùng không rõ trên bản sao ảnh (03m, C2).
mask:
  margin: 0.1          # nới hộp mỗi chiều khi che
  max_cover: 0.5       # che quá phần này của một hộp đã gán nhãn thì vẫn loại ảnh ("phần lớn vật thể")
  fill: [114, 114, 114]  # màu nền letterbox của Ultralytics
  side: 1920           # ảnh che lưu cạnh dài tối đa, lớn hơn imgsz 960
  quality: 95

# Quyết định chọn bản (04e_ppe6_eval.py), khóa 06/11/2026 trước khi train. Chi tiết ở docs/experiments/2026-11-06_ppe6_plan.md.
decision:
  seed: 0
  n_boot: 1000
  max_mean_drop: 0.01
  max_class_drop: 0.02
  new_class_target: 0.5

# Quy tắc sau duyệt (03n_ppe6_readiness.py), khóa 07/11/2026 trước khi có kết quả P2, P2_chv.
gates:
  max_disagreement: 0.10   # P0a: bất đồng agent, người từ mức này thì đề xuất kiểm tra nhãn train
  min_boots_eval: 80       # P0a: dưới mức này ở val_new hoặc test_new thì dừng
  min_shoe_rate: 0.10      # P2: tỉ lệ giày bảo hộ thật từ mức này thì đề xuất che vùng
  min_chv_rate: 0.10       # P2_chv: tỉ lệ ảnh thiếu nhãn ủng mỗi tầng từ mức này thì không dùng nguyên trạng

# Bản dữ liệu: nhóm chọn 07/11/2026, có hiệu lực khi kết quả duyệt không buộc đổi dữ liệu. Người dùng đặt data_locked true sau khi xem `03n gates`.
final:
  main: c2
  control: c1
  data_locked: false

# Kiểm tra đầu ra train (04f_check_run.py). r2 best.pt 19,2 MB.
kaggle:
  min_best_mb: 10
  max_best_mb: 60
  class_names: [person, helmet, vest, gloves, goggles, boots]
