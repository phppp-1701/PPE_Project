# Thử nghiệm 6 lớp, nhánh exp/ppe6 (docs/experiments/2026-11-06_ppe6_plan.md).
# Lớp 0-3 giữ nguyên ppe4 để so được với r2, r3. Dùng bởi scripts/03c_ppe6_review_sheets.py.
classes: {0: person, 1: helmet, 2: vest, 3: gloves, 4: goggles, 5: boots}

review:
  seed: 0
  # Mã lớp gốc của hộp cần duyệt. Tên lớp xem data/raw/<bộ>/README.md và data/raw/construction_ppe/data.yaml.
  sources:
    sh17: {goggles: 8, boots: 14}               # glasses, shoes: lẫn đồ thường, phải duyệt
    construction_ppe: {goggles: 4, boots: 3}    # goggles, boots
  # Hộp có cạnh dài dưới min_side_px ở đầu vào imgsz không được duyệt bằng mắt. Giá trị đặt theo cảm quan, chưa đo.
  min_side_px: 24
  min_side_grid: [16, 20, 24, 28, 32, 40]
  dark_luma: 70        # trung vị độ sáng 0-255 của hộp dưới mức này coi là giày tối, chỉ để phân tầng mẫu
  p2_shoes: 100
  imgsz: 960
  # Bảng ảnh duyệt: chỉ để người và máy xem, không ảnh hưởng nhãn.
  sheet: {cols: 10, rows: 8, tile_px: 128, context: 0.75}   # context: nới mỗi phía, tính theo cạnh dài của hộp

# Định nghĩa kính phiên bản 2 (06/11/2026): Claude xem lại 407 hộp `safety` ngoài cảnh mũ cam. Dùng bởi 03d_ppe6_decisions_v2.py.
goggles_v2:
  dark_lens: >-
    b00048 b00071 b00668 b00708 b00709 b00710 b00888 b00889 b01335 b01348 b01401 b01402 b01403 b01404 b01407 b01465
    b01524 b01556 b01582 b01718 b01845 b02210 b02607 b02766 b02767 b02769 b02772 b03032 b03185 b03201 b03215 b03226
    b03228 b05032 b05035 b05089 b05249 b05318 b06362 b07305 b07995 b07996 b08004 b08006 b08009 b08010 b08495
  plain_frame: b00679 b00680 b00702 b00707 b00811 b00835 b00848 b00855 b00879 b00898
  not_worn: b05483

# Gom cảnh: đặc trưng từ 03e_ppe6_scene_features.py, ngưỡng do 03f chọn và báo cáo.
scene:
  weights: yolo11s.pt
  imgsz: 320
  side: 640
  batch: 32
  sweep: {emb_strong: [0.95, 0.96, 0.97, 0.98, 0.99]}
  near_margin: 0.02
  near_samples: 60
  # Chọn 06/11/2026 bằng 03f --sweep: 8475 cụm, cụm lớn nhất 397 ảnh (355/380 ảnh thẻ mũ cam, 385/411 ảnh thẻ ủng đỏ).
  # Ngưỡng lỏng hơn nối thành cụm hàng nghìn ảnh; chặt hơn (emb 0.95) xé cảnh đã biết thành hơn 100 cụm.
  # emb_strong: nới thêm cho cặp rất giống nhưng khác màu; chọn 06/11/2026 bằng --sweep: 0.97 cho 8322 cụm, lớn nhất 573; 0.96 lên 951.
  emb_strong: 0.97
  phash_max: 8
  emb_min: 0.93
  hist_min: 0.85

# Chọn cảnh cho val_new, test_new (03h_ppe6_select_eval.py). Mục tiêu do nhóm đặt 06/11/2026.
eval:
  seed: 0
  target_boots: 100
  cp_share: 0.3            # tỉ lệ tối thiểu hộp ủng Construction-PPE ở mỗi tập
  max_scene_boots: 30      # cảnh có nhiều hộp ủng hơn mức này thì không dùng, để hộp trải trên nhiều cảnh
  levels: [[80, 0.3], [100, 0.3], [120, 0.3]]


train_scene_cap: 30        # mỗi cảnh lặp ở train giữ tối đa chừng này ảnh (nhóm chốt 06/11/2026)
# Cụm thật sự là một cảnh lặp, Claude xem 10 ảnh mẫu của 8 cụm lớn nhất, chờ người xác nhận. s00000, s00002, s00003, s00004, s00006
# là cụm nối nhầm các ảnh không liên quan nên không giới hạn. Không dùng số đo: median cosine không tách được (s00001 0.869, s00003 0.913).
repeat_scenes: [s00001, s00005, s00007]

# Kiểm tra sơ bộ CHVG của Claude (06/11/2026), chưa phải người duyệt. Số là idx trong external/chvg/glass_order.csv.
# unclear: mờ, tối, không rõ là kính bảo hộ, hoặc gọng giống kính cận.
chvg_precheck:
  unclear: >-
    13 25 26 27 28 33 38 39 70 71 72 74 79 80 108 124 133 138 152 190 202 230 231 233 284 285 289 291 297 310 420
  missing_label_images: "50 88 94"   # thứ tự trong noglass_order.txt: ảnh không có hộp glass nhưng thấy người đeo kính

# Gói duyệt CVAT (03k). Thời gian là giả định để ước tính, chưa đo.
pack:
  side: 1920
  p2_chvg: 60
  sec_per_box: 6
  sec_per_image: 8
  sec_per_scene: 20
  sec_per_chv_image: 15
  trial_boxes: 10
  chv_boots_images: 100

# Ngưỡng "người đủ lớn" (03l --report): chiều cao người tối thiểu mà từ đó trở lên tỉ lệ người duyệt nhìn rõ đạt min_ok_rate.
# Chưa chọn: phải có kết quả duyệt, chốt trước khi train.
scope:
  side: 1920
  min_ok_rate: 0.9
  min_boxes: 30          # cần ít nhất chừng này hộp có ý kiến mỗi lớp mới đề xuất ngưỡng; Claude đặt, chưa đo
  min_person_px: {boots: 188.0, goggles: 489.6}   # người dùng chọn 09/11/2026: tính từ val (03n scope chỉ val), chưa đo được, chỉ là cận dưới quan sát được (người thấp nhất)

# Ghép kính CHVG vào ảnh CHV train (03m). Ngưỡng xác nhận cùng ảnh, cùng hệ tọa độ, đo ngày 06/11/2026 trên 1.283 ảnh trùng tên.
chv_merge:
  min_corr: 0.98
  max_hamming: 8
  min_helmet_iou: 0.5
  # Claude xem 130 hộp kính ở ảnh CHV train: tối, mờ, gọng giống kính cận thì để không rõ. Số là idx trong glass_order.csv. Chưa người duyệt.
  unclear: >-
    364 368 376 398 412 413 414 415 426 427 432 436 437 439 449 451 452 453 454 455 458 476 477 478 481 482 483 484 485 492 493 494 508 509 520 528

# Che vùng không rõ trên bản sao ảnh (03m, C2).
mask:
  margin: 0.1          # nới hộp mỗi chiều khi che
  max_cover: 0.5       # che quá phần này của một hộp đã gán nhãn thì vẫn loại ảnh ("phần lớn vật thể")
  fill: [114, 114, 114]  # màu nền letterbox của Ultralytics
  side: 1920           # ảnh che lưu cạnh dài tối đa, lớn hơn imgsz 960
  quality: 95

# P2_chv (03n gates action theo nhãn máy machine_pass_c, 08/11/2026; người dùng giao agent chọn trong ba cách của quy tắc: gán, che, bỏ).
# Che theo hộp người đã thử và bỏ: xem mẫu, vùng che rơi vào thân người ở khoảng nửa số ảnh (người bị cắt, chân dung).
# Chọn bỏ ảnh khỏi C2, C1 giữ nguyên. Tầng `lon`: 3/23 ảnh còn sót sau khi bỏ ảnh thấy chân (13%, vẫn từ mức 10%) nên bỏ cả tầng.
# Tầng `vua`: bỏ ảnh thấy chân; phần giữ lại 0/8 ảnh sót trong mẫu. Tầng `nho` đạt (0/33), giữ.
chv_boot_drop:
  drop_all: [lon]
  drop_feet_visible: [vua]
  min_aspect: 1.6    # hộp người cao từ 1,6 lần rộng coi là dáng cả người; Claude đặt sau khi xem mẫu, chưa đo
  max_bottom: 0.97   # đáy hộp người từ mức này coi như chạm mép dưới, chân không trong ảnh

# Quyết định chọn bản (04e_ppe6_eval.py), khóa 06/11/2026 trước khi train. Chi tiết ở docs/experiments/2026-11-06_ppe6_plan.md.
# Tự nhất quán trên khung lặp (03u). Khung lặp dùng scene.phash_max, scene.emb_strong; min_iou Claude đặt, chưa đo.
consistency:
  min_iou: 0.5

# Vùng bỏ qua khi đánh giá lớp mới (người dùng chọn cách A, 07/11/2026, sau khi thấy số nhãn, trước khi có kết quả mô hình).
# Hộp người chốt unclear hoặc ignore không phải nhãn và không bỏ cả ảnh. Theo COCO (iscrowd) và CityPersons (ignore):
# 1) dự đoán ghép với hộp thật trước (IoU >= 0.5, cùng lớp, như validator Ultralytics); 2) dự đoán không ghép được hộp thật
# mà phần giao với một vùng bỏ qua cùng lớp chia diện tích dự đoán >= min_overlap thì không tính đúng, không tính sai;
# 3) một vùng nhận được nhiều dự đoán; 4) vùng không bao giờ là hộp bị sót. Chỉ áp dụng cho mAP50 của lớp mới.
eval_ignore:
  labels: [unclear, ignore]
  overlap: intersection_over_detection
  min_overlap: 0.5

decision:
  seed: 0
  n_boot: 1000
  max_mean_drop: 0.01
  max_class_drop: 0.02
  new_class_target: 0.5

# Quy tắc sau duyệt (03n_ppe6_readiness.py), khóa 07/11/2026 trước khi có kết quả P2, P2_chv.
gates:
  max_disagreement: 0.10   # P0a: bất đồng agent, người từ mức này thì đề xuất kiểm tra nhãn train
  min_boots_eval: 80       # P0a: dưới mức này ở val_new hoặc test_new thì dừng
  min_shoe_rate: 0.10      # P2: tỉ lệ giày bảo hộ thật từ mức này thì đề xuất che vùng
  min_chv_rate: 0.10       # P2_chv: tỉ lệ ảnh thiếu nhãn ủng mỗi tầng từ mức này thì không dùng nguyên trạng

# Bản dữ liệu: nhóm chọn 07/11/2026, có hiệu lực khi kết quả duyệt không buộc đổi dữ liệu. Người dùng đặt data_locked true sau khi xem `03n gates`.
final:
  main: c2
  control: c1
  data_locked: true    # người dùng khóa 09/11/2026 (commit sau 8ed155c)

# Kiểm tra đầu ra train (04f_check_run.py). r2 best.pt 19,2 MB.
kaggle:
  min_best_mb: 10
  max_best_mb: 60
  class_names: [person, helmet, vest, gloves, goggles, boots]

# Gói duyệt mù (03p_ppe6_blind_pack.py), nhóm yêu cầu 07/11/2026.
blind:
  seed: 0
  side: 1920           # mọi ảnh đưa về cùng cạnh dài để kích thước không lộ nguồn
  second_boxes: 50     # số hộp cho người thứ hai
  second_floor: 2      # mỗi tầng (lớp, nguồn, nhãn agent) tối thiểu chừng này hộp nếu có; Claude đặt

# Công cụ duyệt nhanh (03q, 03r). Chỉ thao tác, không có giá trị nhãn. tasks: mã task trên CVAT cục bộ.
fast_review:
  port: 8765
  cvat_url: http://localhost:8080
  token_env: CVAT_LOCAL_TOKEN   # token CVAT cục bộ, người dùng tự đặt trong phiên; khác CVAT_ACCESS_TOKEN của CVAT cloud
  zoom_context: 1.0             # ảnh phóng to: nới mỗi phía theo cạnh dài của hộp
  tasks: {task_a: 5, task_b: 6, task_c: 7, task_d: 8}

# Máy gán nhãn trước, người kiểm định sau (người dùng đổi 07/11/2026). Nhãn máy không phải nhãn người.
labeling:
  mode: machine_audit
  guide_version: 2
  passes: {a: 101, b: 202}     # seed trộn thứ tự của từng lượt
  sheet: {box_cols: 3, box_rows: 4, panel_px: 240, image_cols: 3, image_rows: 3, image_px: 460, zoom_context: 1.0}
  batch_sheets: 16             # số bảng ảnh mỗi ngữ cảnh mới
  audit:
    seed: 303
    consensus_sample: 150
    floor: 8                   # mỗi tầng tối thiểu chừng này hộp nếu có; Claude đặt
    max_queue_boxes: 300       # hàng đợi bất đồng quá mức này thì dừng và đề xuất lấy mẫu; Claude đặt
    max_disagreement: 0.10
    image_sample: 60           # mẫu ảnh đồng thuận ở task_b, task_d; Claude đặt
  # Ước tính thời gian gói mới. Đo 07/11/2026 trên log 03q của Phuong: audit 3,4 giây mỗi hộp, boots_v3 2,9 giây (hai phím).
  # Dùng 5 giây để chừa chỗ cho chấm chậm. Ảnh: config pack.sec_per_image 8 giây (giả định, audit_img2 đo 2 giây, quá nhanh để tin).
  sec_per_box_measured: 5
  sec_per_image_measured: 8

# Soát nhãn train bằng OWLv2 (03w), không train. Câu hỏi, ngưỡng do Claude đặt để chạy thử, chưa đo.
owl_scan:
  model: google/owlv2-base-patch16-ensemble
  seed: 7
  queries:
    goggles: ["safety goggles", "safety glasses"]
    boots: ["rubber boots", "work boots", "safety boots"]
  min_score: 0.1
  nms_iou: 0.5
  match_iou: 0.3
  report_scores: [0.2, 0.3, 0.4]

# C4 (03x): thêm ảnh Construction-PPE bản mới vào train. Người dùng đồng ý tải, dùng 10/11/2026.
# min_boot_px: Claude xem 63 hộp ủng mẫu; sai tập trung ở hộp nhỏ (14 sai, 12 dưới 30 px); từ 30 px: 2/47 sai (4%). Chưa đo thêm.
cppe2:
  side: 960
  min_boot_px: 30
  fill: [114, 114, 114]
  class_map: {Person: 0, helmet: 1, vest: 2, gloves: 3, goggles: 4, boots: 5}

# Bộ phân loại ảnh cắt bộ phận (03y, bước kiểm tra thứ hai; người dùng duyệt phương án 2 ngày 13/11/2026).
# Claude đặt để tạo dữ liệu, chưa đo: context = cạnh ảnh cắt / cạnh dài hộp; min_px bỏ hộp quá nhỏ.
parts:
  # Bản 1 (13/11/2026): chỉ ảnh cắt theo hộp, tâm ở giữa, context 1.6 -> run yolo11n_cls_parts; trên video lệch với
  # ảnh cắt theo keypoint của pipeline. Bản 2 (phương án 1 + 2 + 3, kế hoạch 13/11/2026): thêm ảnh cắt theo keypoint,
  # xê dịch ảnh cắt theo hộp, tăng cường giống video. version: 1 tạo lại đúng dữ liệu bản 1.
  # Bản 3 (kế hoạch 13/11/2026, sau video kiem_thu_gan): thêm áo vest / no_vest (vùng thân theo vai, hông; train có ảnh
  # cắt mất phần dưới), ảnh cắt mắt khi mặt nghiêng (một mắt + mũi), tăng cường trắng đen.
  # Bản 4 (kế hoạch 14/11/2026): thêm vùng đầu helmet / no_helmet (mũ nhìn từ sau, video17 kiem_thu_gan).
  # Bản 5 (kế hoạch 2026-11-16_post_holdout_fixes mục 3 và 3b, người dùng duyệt 16/11/2026): chỉ đổi vùng đầu. Gốc =
  # data/ppe6/parts bản 4 chép nguyên; thêm ảnh đầu từ kho nguồn mới (CHV train, CC0, SHWD) chọn theo tầng để mỗi tầng
  # (kiểu cắt, tối, nhỏ) có mũ ~ không mũ. version: 4 tạo lại đúng bản 4.
  version: 5
  v5:
    out: data/ppe6/parts_v5
    base_from: data/ppe6/parts        # train + val bản 4, chép nguyên
    pool: data/ppe6/parts_v5_pool     # kho ảnh đầu nguồn mới (meta.csv), chỉ có trên máy
    check_out: data/ppe6/parts_v5_check   # tập kiểm riêng, chỉ để báo cáo (không là tiêu chí)
    extra_head_sources: [chv_train, hard_hat_cc0, shwd]   # nguồn nào chưa có trên máy thì bỏ qua, ghi vào summary
    check_sources: [hard_hat_cc0, shwd]
    check_frac: 0.15                  # người dùng duyệt 16/11/2026
    pool_max_per_src_cls: 12000       # hộp mỗi (nguồn, lớp) trong kho; Claude đặt (đủ cho g = 1, giới hạn thời gian pose)
    back_view: {kp_conf: 0.3, min_sep: 0.05, face_strong: 0.9}   # như compliance.back_view (bước D)
    back_dark: {copies: 2, v: [0.2, 0.5], gray: 0.5}               # bản làm tối mỗi ảnh đầu nhìn từ sau (kho)
    dedup_hamming: 6                  # pHash 64 bit: ảnh cách ảnh đánh giá (hoặc ảnh tập kiểm) <= mức này thì bỏ khỏi train
    # Chọn theo tầng (mục 3b): tối = V < dark_v (chẩn đoán mục 1), nhỏ = cạnh < small_px; đích mỗi tầng g * max(gốc mũ,
    # gốc không mũ); mỗi nguồn <= cap_src phần ảnh thêm; kiểm mũ / không mũ mỗi tầng trong ratio_ok. small_px, cap_src, g:
    # Claude đề xuất, chạy thử trên kho lần đầu, người dùng duyệt g = 1.
    balance: {dark_v: 90, small_px: 48, g: 1.0, cap_src: 0.6, ratio_ok: [0.8, 1.25]}
  seed: 13
  context: 1.6              # bản 1, và ảnh cắt theo hộp của val
  min_px: 24
  save_px: 224
  max_per_class: 4000       # mỗi lớp, mỗi kiểu ảnh cắt (hộp, keypoint) ở train
  # Bản 2 (Claude đặt 13/11/2026, trước khi train):
  box_jitter: {shift: 0.2, context: [1.3, 2.4]}   # tâm lệch tới shift * cạnh mỗi chiều; context ngẫu nhiên trong khoảng
  kp_geom: {k: [0.0, 0.5], s: [0.9, 2.5], eye_s: [2.0, 4.0], torso_s: [1.0, 2.2], torso_h: [1.2, 2.0],
            head_k: [0.0, 0.6], head_s: [0.6, 1.6]}   # phủ lưới calibration.part_geom_grid
  aug: {prob: 0.35, blur_px: [5, 15], dark: [0.35, 0.8], jpeg: [20, 60], gray: 0.15,   # nhòe, tối, nén, trắng đen; chỉ train
        trunc: {prob: 0.3, keep: [0.35, 0.7]}}   # áo: giữ phần trên của ảnh cắt (người sát camera); Claude đặt
  train:
    model: yolo11n-cls.pt
    run_name: yolo11n_cls_parts_v5   # bản 1: yolo11n_cls_parts, bản 2, 3, 4: yolo11n_cls_parts_v2, _v3, _v4
    args: {imgsz: 160, epochs: 60, patience: 15, batch: 128, seed: 0, deterministic: true, workers: 4, fliplr: 0.5, degrees: 0}

error_analysis:
  # Phân tích lỗi detector trên val (scripts/04h_error_analysis.py, kế hoạch 2026-11-16_c5_detector_plan.md bước A).
  # Chỉ để chẩn đoán, không chọn tham số. Claude đặt 16/11/2026; conf 0,25 và IoU 0,5 như analyze ở train.yaml.
  conf: 0.25                 # dự đoán từ mức này mới tính là báo thừa
  match_iou: 0.5             # ghép dự đoán với nhãn cùng lớp
  loc_iou: 0.1               # 0,1 <= IoU < 0,5 với nhãn cùng lớp: lỗi lệch hộp
  neg_iou: 0.3               # dự đoán trùng vật âm của nhãn gốc (tay trần, giày thường...) từ mức này
  size_bins_px: [16, 32, 64] # cạnh ngắn của hộp nhãn ở không gian ảnh vào mô hình (imgsz 960)
  n_samples: 40              # số ô cắt mỗi bảng ảnh
  seed: 0
  runs:
    - {name: c4_val_gloves, capture: outputs/results/ppe6_eval/c4_ppe4val, images: data/ppe4/dataset/images/val, classes: [gloves, helmet, vest]}
    - {name: c4_valnew, capture: outputs/results/ppe6_eval/c4_valnew, images: data/ppe6/dataset/images/val_new_draft, classes: [goggles, boots], ignore: true}
    # C5-s960 trên val đã sửa (17/11/2026, sau khi chọn C5): găng trên ảnh ppe4 val, ủng trên ảnh lớp mới; ignore của 03z
    - {name: c5s960_val_gloves, capture: outputs/results/c5_eval/c5_s960_val, images: data/ppe6/c5/eval/val/images, classes: [gloves], ignore: c5, split: val, subset: ppe4}
    - {name: c5s960_val_boots, capture: outputs/results/c5_eval/c5_s960_val, images: data/ppe6/c5/eval/val/images, classes: [boots], ignore: c5, split: val, subset: new_class_files}
    # C6 c6_ft (18/11/2026, sau khi chọn C6): áo, găng trên ảnh ppe4 val; ủng trên ảnh lớp mới
    - {name: c6ft_val_ppe4, capture: outputs/results/c5_eval/c6_ft_val, images: data/ppe6/c5/eval/val/images, classes: [vest, gloves], ignore: c5, split: val, subset: ppe4, sheets_vest: true}
    - {name: c6ft_val_boots, capture: outputs/results/c5_eval/c6_ft_val, images: data/ppe6/c5/eval/val/images, classes: [boots], ignore: c5, split: val, subset: new_class_files}
  # Vật âm trong nhãn gốc (không phải lớp của detector): mã lớp gốc theo bộ
  negatives:
    sh17: {gloves: [11], boots: [6, 14], goggles: [8], vest: [13, 15]}   # 11 hands, 6 foot, 14 shoes, 8 glasses, 13 medical-suit, 15 safety-suit
    construction_ppe: {gloves: [9], boots: [10], goggles: [8]}    # 9 no_gloves, 10 no_boots, 8 no_goggle

speed_check:
  # Đo tốc độ detector trên laptop (scripts/04i_detector_speed.py), kế hoạch 2026-11-16_c5_detector_plan.md bước A.
  video: data/videos/video4.mp4   # video phát triển, như benchmark 07
  frames: 220
  warmup: 20
  imgsz: [960]
  # 18/11/2026: thêm FP16 (half) để xem YOLO11m có đạt >= 20 FPS (c5 mục tiêu tốc độ); lần 17/11 dùng imgsz [960, 1280], FP32
  weights: [outputs/train/yolo11s_ppe6_c6_ft/weights/best.pt, yolo11m.pt]
  half: [false, true]
  out: detector_speed_fp16.json

c5_relabel:
  # Bước B, F kế hoạch 2026-11-16_c5_detector_plan.md: sửa nhãn găng, ủng, kính và mở rộng val, test kính, ủng
  # (scripts/03z_c5_relabel.py). Nhãn máy (lượt máy + Claude xem ảnh), không phải nhãn người. Tham số do Claude đặt
  # 16/11/2026 từ hai lần chạy thử trên mẫu train / val (scratchpad, ghi trong kế hoạch mục 2B), không chọn theo điểm mô hình.
  out: data/ppe6/c5
  seed: 16                  # thứ tự ô trên bảng ảnh
  owl:
    model: google/owlv2-base-patch16-ensemble
    # Chạy thử 60 ảnh val: "a glove", "a work glove", "a gloved hand" tìm lại 92% hộp găng ở 0,2
    queries:
      gloves: ["a glove", "a work glove", "a gloved hand"]
      boots: ["rubber boots", "work boots", "safety boots"]
      goggles: ["safety goggles", "safety glasses"]
    min_score: 0.1            # lưu mọi dự đoán từ mức này
    nms_iou: 0.5
  propose:
    owl_score: 0.2            # đề xuất OWLv2 từ mức này (chạy thử: tìm lại 92% găng có nhãn)
    c4_conf: 0.25             # đề xuất của detector C4 từ mức này (như error_analysis.conf)
    hand_p: 0.25              # hộp hands SH17: p găng của bộ phân loại tay từ mức này thì đưa Claude xem
    new_iou: 0.3              # đề xuất trùng nhãn cùng lớp từ mức này thì không phải nhãn thiếu
    hands_weights: outputs/train/yolo11n_cls_parts_v4/weights/best.pt
    context: 1.6              # ảnh cắt tay như parts.context

c5_decision:
  # Tiêu chí chọn bản C5 (kế hoạch 2026-11-16_c5_detector_plan, khóa 17/11/2026 trước khi train, người dùng đồng ý).
  runs: [c5_s960, c5_s1280]
  new_classes_mean: [gloves, goggles, boots]   # găng: tập ppe4; kính: goggles_all (lớp mới + CHVG, 17/11 sau khi thêm CHVG, trước train); ủng: tập lớp mới (04j)
  min_gain_1280: 0.02
  min_fps: 20
  max_p95_ms: 100
  no_drop: [gloves, boots]       # so với C4 trên val đã sửa
  max_old_drop: 0.02             # người, mũ, áo

c6_ext:
  # C6 bước C (03za_c6_external_boots.py, kế hoạch 2026-11-16_c5_detector_plan mục C6), người dùng đồng ý 17/11/2026.
  # Ngưỡng do Claude đặt trước khi xem kết quả, chỉ để lọc / gán nhãn máy cho train; không chọn trên val.
  weights: outputs/train/yolo11s_ppe6_c5_s960/weights/best.pt
  sources:
    vf: {dir: data/raw/safety_shoe_vf, prefix: vf, boots: [1]}        # 1 safety-shoe; 0 no_safety-shoe = mẫu âm
    nc: {dir: data/raw/safety_shoes_nc, prefix: nc, boots: [0, 4]}    # 0 Safety-shoes, 4 safety_shoe; 2 not_safety_shoe = mẫu âm; 1 d, 3 person bỏ
  rot_min: 0.5          # ảnh xoay: person conf khi xoay 90° >= mức này
  rot_margin: 0.2       # và hơn ảnh gốc ít nhất chừng này
  dedup_hamming: 6      # như parts.v5.dedup_hamming (gần trùng trong, giữa hai bộ)
  group_hamming: 10     # nhóm cảnh (tên gốc) có ảnh cách ảnh đánh giá <= mức này thì bỏ cả nhóm; khoảng cách ngẫu nhiên tối thiểu thường 12-16 (đo 17/11)
  pseudo_conf: 0.5      # người, mũ, áo: nhãn máy từ C5-s960
  mask_conf: 0.25       # người, mũ, áo conf trong [0,25; 0,5): che
  mask_conf_small: 0.1  # găng, kính: che mọi dự đoán từ mức này (không gán nhãn máy)
  max_side: 1280

c6_decision:
  # Tiêu chí chọn C6 (kế hoạch 2026-11-16_c5_detector_plan mục C6), khóa 17/11/2026 trước khi train, người dùng đồng ý.
  # Hai bản cùng dữ liệu (c5_pack + c6_extra_pack), imgsz 960: c6_scratch (từ yolo11s.pt, như C5) và c6_ft (tinh chỉnh từ
  # C5-s960). So với C5-s960 trên val đã sửa (04j), mỗi lớp như c5_decision (găng: ppe4; kính: goggles_all; ủng: lớp mới).
  baseline: c5_s960
  runs: [c6_scratch, c6_ft]
  pick_by: mean_new_classes      # giữa hai bản C6: trung bình mAP50 găng, kính, ủng cao hơn
  min_boots_gain: 0.03           # C6 thay C5 khi ủng tăng >= mức này
  max_drop: 0.02                 # và găng, kính, người, mũ, áo không tụt quá mức này
  ft: {epochs: 40, optimizer: SGD, lr0: 0.002, warmup_epochs: 1}   # tinh chỉnh; Claude đặt, không chọn trên val. optimizer phải đặt rõ (auto bỏ qua lr0)

c7:
  # C7 (03zb_c7_prep.py, kế hoạch 2026-11-16_c5_detector_plan mục C7), người dùng chọn phương án a 18/11/2026.
  # Claude đặt trước khi xem kết quả, không chọn trên val.
  weights: outputs/train/yolo11s_ppe6_c6_ft/weights/best.pt   # mô hình dùng để tìm ủng báo thừa trên train
  fp_conf: 0.3            # dự đoán ủng từ mức này, không trùng nhãn ủng (IoU < match_iou) -> Claude xem
  match_iou: 0.3
  seed: 19
  hard_neg_copies: 2      # ảnh có giày thường bị nhận nhầm (Claude xác nhận n): lặp thêm 2 bản
  vest_sh17_copies: 1     # ảnh SH17 train có áo: lặp thêm 1 bản (áo SH17 recall 0,452 ở c6_ft)

c7_decision:
  # Tiêu chí chọn C7 (kế hoạch 2026-11-16_c5_detector_plan mục C7), khóa 18/11/2026 trước khi train.
  # C7-m: YOLO11m (yolo11m.pt COCO), imgsz 960, dữ liệu c5_pack + c7_extra_pack, train DDP trên 2 GPU T4 của Kaggle.
  baseline: c6_ft
  min_mean_gain: 0.02     # trung bình mAP50 găng (ppe4), kính (goggles_all), ủng (lớp mới) tăng >= mức này
  max_drop: 0.02          # và không lớp nào (người, mũ, áo, găng, kính, ủng) tụt quá mức này
  half_check: 0.005       # chấm FP16 trên val: mỗi lớp lệch FP32 không quá mức này thì được chạy FP16
  min_fps: 20             # và pipeline (07, FP16 nếu đạt half_check) >= 20 khung/giây, p95 <= 100 ms
  max_p95_ms: 100
  train: {model: yolo11m.pt, imgsz: 960, device: "0,1", batch: 16, epochs: 100, patience: 20, time: 11}

c8_rescore:
  # C8 thử (04l_gloves_rescore.py): chấm lại hộp găng của detector bằng bộ phân loại tay. Claude đặt 19/11/2026; w chọn trên val.
  min_conf: 0.05       # chỉ chấm lại dự đoán từ mức này (dưới mức này xếp cuối)
  context: 1.6         # như parts.context
  imgsz: 160           # như part_cls.imgsz
  weights_grid: [0.0, 0.25, 0.5, 0.75]   # 0 = điểm gốc của detector

c8:
  # C8 găng (03zc_c8_gloves.py, kế hoạch 2026-11-16_c5_detector_plan mục C8), người dùng chọn phương án a 19/11/2026.
  # Claude đặt trước khi xem kết quả.
  weights: outputs/train/yolo11s_ppe6_c6_ft/weights/best.pt
  seed: 23
  train_conf: 0.4       # găng báo thừa trên train từ mức này -> Claude xem (mẫu âm khó / găng thiếu nhãn)
  eval_conf: 0.4        # val, test: dự đoán găng từ mức này của mọi bản, gộp hộp trùng (merge_iou)
  match_iou: 0.3        # trùng nhãn găng có sẵn từ mức này thì không phải ứng viên
  merge_iou: 0.5
  eval_captures: [outputs/results/c5_eval/c4_val, outputs/results/c5_eval/c5_s960_val, outputs/results/c5_eval/c6_ft_val, outputs/results/c5_eval/c7_m_val]
  hard_neg_copies: 2
  test_weights: [outputs/train/yolo11s_ppe6_c4/weights/best.pt, outputs/train/yolo11s_ppe6_c5_s960/weights/best.pt, outputs/train/yolo11s_ppe6_c6_ft/weights/best.pt, outputs/train/yolo11m_ppe6_c7/weights/best.pt]

c8_ext:
  # C8 găng ngoài (03za --section c8_ext), như c6_ext. Nguồn điền khi người dùng tải (data/raw/<bộ>/, README ghi giấy phép).
  out: data/ppe6/c8
  weights: outputs/train/yolo11s_ppe6_c6_ft/weights/best.pt
  sources: {}            # vd: sg: {dir: data/raw/safety_gloves_ru, prefix: sg, ids: [<mã lớp gloves>], target: 3}
  rot_min: 0.5
  rot_margin: 0.2
  dedup_hamming: 6
  group_hamming: 10
  pseudo_conf: 0.5
  mask_conf: 0.25
  mask_conf_small: 0.1
  max_side: 1280
