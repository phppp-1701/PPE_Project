# Huấn luyện YOLO11s (docs/spec.md mục 3). Dùng bởi scripts/04_train.py, chạy trên Kaggle.
# Lần 1: giữ mặc định Ultralytics 8.4.189 để có kết quả gốc; chỉ ghi ra những gì đặt khác hoặc cần nêu rõ.
# Đổi tham số ở các lần sau dựa trên kết quả val, ghi lại trong docs/experiments/.

# r1 (03/11/2026): imgsz 640, patience 100 — xem docs/experiments/2026-11-03_yolo11s_r1.md.
# r2: chỉ đổi imgsz 640 -> 960 (găng tay sót chủ yếu là hộp nhỏ, theo phân tích lỗi r1 trên val); patience 20.
# r3: như r2, thêm bộ phụ ở train (mục extra; xem docs/experiments khi có kết quả). Val và test giữ nguyên để so với r2.
run_name: yolo11s_ppe4_r3
model: yolo11s.pt        # trọng số tiền huấn luyện COCO; head được thay theo 4 lớp của data.yaml

# Khi tạo bản ghi được trên Kaggle (04_train.py), thu nhỏ trước ảnh có cạnh dài hơn mức này về đúng mức này,
# cùng cách Ultralytics thu nhỏ (ceil, INTER_LINEAR), lưu JPEG chất lượng 95. Đặt bằng train.imgsz.
# Ảnh gốc trên máy và Kaggle Dataset không đổi. Bỏ trống (null) thì dùng liên kết tới ảnh gốc như r1.
copy_max_side: 960

train:
  # 960: găng cạnh 8-16 px ở 640 thành 12-24 px. Không dùng 1280 (ước tính gấp 4 thời gian r1, quá 12 giờ Kaggle).
  imgsz: 960
  epochs: 100            # mặc định
  batch: -1              # AutoBatch: tự chọn theo bộ nhớ GPU (khoảng 60%); số thật ghi trong args.yaml
  # Dừng sớm khi mAP@0.5:0.95 trên val không vượt mức tốt nhất sau `patience` epoch liền.
  # Chọn 03/11/2026 theo đường học val của r1: 10 sẽ dừng ở epoch 11 (sau khởi động điểm giảm tạm thời),
  # 20 dừng ở epoch 84 và vẫn giữ best (epoch 64). r1 chạy với 100 (mặc định).
  patience: 20
  time: 11               # dừng sau 11 giờ, trong giới hạn 12 giờ của Kaggle (r3 nhiều ảnh hơn r2 khoảng 50%)
  seed: 0
  deterministic: true
  device: 0              # một GPU (Kaggle T4)
  workers: 4             # Kaggle có 4 nhân CPU
  # r1 dùng cache "ram" (~8 GB ở 640). Lần chạy r2 đầu tiên (03/11) với cache ram ở 960 bị Kaggle tắt vì hết RAM
  # (ảnh cache 13,8 GB, RAM còn 1,1/31,3 GB khi vào epoch 1). Nay thay bằng copy_max_side bên dưới.
  # Không dùng "disk": Ultralytics lưu ảnh cỡ gốc đã giải nén (>100 GB).
  cache: false
  # Tăng cường: giữ mặc định Ultralytics. Nêu rõ hai phép spec mục 2.4 cấm, mặc định đã tắt:
  flipud: 0.0            # không lật dọc
  degrees: 0.0           # không xoay góc lớn (mặc định không xoay)

# Bộ phụ cho r3 (scripts/03b_make_extra_train.py), chỉ tạo từ ảnh train. Đặt 06/11/2026 khi lập kế hoạch r3, chưa thử.
extra:
  seed: 0
  video_side: 1920       # thu ảnh về cạnh dài này trước khi cắt, như khung video 1080p
  margin: 0.1            # = detector.crop.margin trong pipeline.yaml
  min_person_px: 30      # cỡ người đo ở đầu vào imgsz; dưới mức này gần như không còn chi tiết
  max_person_px: 180     # = detector.crop.max_person_px trong pipeline.yaml
  min_visible: 0.5       # hộp còn dưới tỉ lệ diện tích này trong ảnh cắt thì bỏ nhãn
  max_crops: 2500        # giới hạn để thời gian train không vượt 12 giờ Kaggle
  max_per_image: 3
  no_ppe_share: 0.15     # tỉ lệ ảnh cắt không có PPE, làm mẫu âm
  oversample_gloves: 1500
  shrink_px: [60, 360]   # chiều cao người sau thu nhỏ, tính ở khung video; 360 = max_person_px ở đầu vào imgsz

# Phân tích lỗi trên val (scripts/04b_analyze_val.py). Chỉ để chẩn đoán, không phải ngưỡng của hệ thống.
analyze:
  conf: 0.25             # mặc định predict của Ultralytics, cùng mức với ma trận nhầm lẫn
  match_iou: 0.5         # dự đoán cùng lớp chồng hộp nhãn IoU >= mức này coi là tìm đúng
  size_bins_px: [8, 16, 32]   # mốc cạnh ngắn của hộp, đo sau khi ảnh thu về imgsz lúc huấn luyện
  n_samples: 30          # số mẫu bỏ sót / dự đoán thừa vẽ ra cho mỗi lớp được chọn
  sample_classes: [gloves]
  seed: 0
  speed_images: 200      # số ảnh val đầu tiên để đo tốc độ (batch 1, như khi chạy video); bỏ 20 ảnh đầu để GPU khởi động
